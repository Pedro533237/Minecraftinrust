name: Build Windows Executable

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Bundle executable with SDL2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $exe = "target/release/minecraftinrust.exe"
          if (!(Test-Path $exe)) {
            throw "Executable not found at $exe"
          }
          Copy-Item $exe "$dist/minecraftinrust.exe" -Force

          # SDL2.dll can be generated by sdl2-sys in different build output paths.
          $dll = Get-ChildItem -Path "target" -Filter "SDL2.dll" -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if ($null -eq $dll) {
            throw "SDL2.dll not found in target directory tree; cannot create runnable Windows bundle"
          }

          Copy-Item $dll.FullName "$dist/SDL2.dll" -Force

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraftinrust-windows-bundle
          path: dist/
